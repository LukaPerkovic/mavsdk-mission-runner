name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ \
            libyaml-cpp-dev \
            libgeographic-dev

      - name: Install MAVSDK
        run: |
          sudo apt-get remove -y libmavsdk-dev libmavsdk2 libmavsdk3 2>/dev/null || true
          wget -q https://github.com/mavlink/MAVSDK/releases/download/v2.12.2/libmavsdk-dev_2.12.2_ubuntu22.04_amd64.deb
          sudo apt-get install -y ./libmavsdk-dev_2.12.2_ubuntu22.04_amd64.deb
      
      - name: Debug — inspect environment
        run: |
          echo "=== GeographicLib package ==="
          dpkg -S GeographicLib/Geodesic.hpp 2>/dev/null || echo "not found via dpkg"
          echo "=== GeographicLib cmake files ==="
          find / -iname "*eographic*.cmake" 2>/dev/null || true
          echo "=== MAVSDK cmake files ==="
          find / -iname "*mavsdk*.cmake" 2>/dev/null || true
        continue-on-error: true

      - name: Debug — MAVSDK install layout & target props
        run: |
          echo "=== headers ==="
          ls /usr/include/mavsdk 2>/dev/null | head
          find / -name "mavsdk.hpp" 2>/dev/null
          echo "=== MAVSDKTargets.cmake (relevant lines) ==="
          grep -nE "INTERFACE_INCLUDE_DIRECTORIES|IMPORTED_LOCATION|add_library" /usr/lib/cmake/MAVSDK/MAVSDKTargets*.cmake
          echo "=== CMake cache: MAVSDK ==="
          grep -i mavsdk build/CMakeCache.txt || true
        continue-on-error: true

      - name: Debug — MAVSDK version installed
        run: |
          dpkg -l | grep -i mavsdk || echo "no mavsdk package"
          ls /usr/include/mavsdk/ | head -30

      - name: Configure
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --parallel

      # - name: Test
      #   run: ctest --test-dir build --output-on-failure