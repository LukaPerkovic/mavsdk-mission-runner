name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ \
            libyaml-cpp-dev \
            libgeographic-dev

      - name: Install MAVSDK from source
        run: |
          git clone --depth 1 --branch v3.15.0 https://github.com/mavlink/MAVSDK.git
          cd MAVSDK
          git submodule update --init --recursive

          # Handle both repo layouts: top-level CMakeLists vs cpp/ subdir
          if [ -f CMakeLists.txt ] && grep -qi "project" CMakeLists.txt; then
            SRC_DIR="."
          elif [ -d cpp ]; then
            SRC_DIR="cpp"
          else
            echo "Cannot find MAVSDK CMake source dir"; exit 1
          fi
          echo "Using MAVSDK source dir: $SRC_DIR"

          cmake -B build -S "$SRC_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_MAVSDK_SERVER=OFF \
            -DBUILD_TESTS=OFF
          cmake --build build --parallel
          sudo cmake --build build --target install
          sudo ldconfig

      - name: Debug — inspect environment
        run: |
          echo "=== GeographicLib package ==="
          dpkg -S GeographicLib/Geodesic.hpp 2>/dev/null || echo "not found via dpkg"
          echo "=== GeographicLib cmake files ==="
          find / -iname "*eographic*.cmake" 2>/dev/null || true
          echo "=== MAVSDK cmake files ==="
          find / -iname "*mavsdk*.cmake" 2>/dev/null || true
        continue-on-error: true

      - name: Debug — MAVSDK install layout & target props
        run: |
          echo "=== headers ==="
          ls /usr/include/mavsdk 2>/dev/null | head
          find / -name "mavsdk.hpp" 2>/dev/null
          echo "=== MAVSDKTargets.cmake (relevant lines) ==="
          grep -nE "INTERFACE_INCLUDE_DIRECTORIES|IMPORTED_LOCATION|add_library" /usr/lib/cmake/MAVSDK/MAVSDKTargets*.cmake
          echo "=== CMake cache: MAVSDK ==="
          grep -i mavsdk build/CMakeCache.txt || true
        continue-on-error: true

      - name: Debug — MAVSDK version installed
        run: |
          dpkg -l | grep -i mavsdk || echo "no mavsdk package"
          ls /usr/include/mavsdk/ | head -30

      - name: Configure
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --parallel

      # - name: Test
      #   run: ctest --test-dir build --output-on-failure
