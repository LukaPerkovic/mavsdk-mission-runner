name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ \
            libyaml-cpp-dev \
            libgeographic-dev

      - name: Install MAVSDK from source
        run: |
          wget https://github.com/mavlink/MAVSDK/releases/download/v3.15.0/libmavsdk-dev_3.15.0_ubuntu22.04_amd64.deb
          sudo dpkg -i libmavsdk-dev_3.15.0_ubuntu22.04_amd64.deb
          sudo apt-get install -f -y

      - name: Configure
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --parallel

      # - name: Test
      #   run: ctest --test-dir build --output-on-failure
